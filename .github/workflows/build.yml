name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Missing gradlew script
      run: |
        cat << 'EOF' > gradlew
        #!/usr/bin/env sh
        exec java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain "$@"
        EOF
        chmod +x gradlew

    - name: Create Secrets File
      run: |
        echo "GEMINI_API_KEY=dummy_key" > .env
        mkdir -p app
        echo "GEMINI_API_KEY=dummy_key" > app/.env

    - name: Build Debug APK
      run: ./gradlew assembleDebug -x test -x lint --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: CinemaTV-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
