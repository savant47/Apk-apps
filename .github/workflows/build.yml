name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create Dummy Secrets File
      run: |
        echo "GEMINI_API_KEY=dummy_key" > .env
        echo "GEMINI_API_KEY=dummy_key" > app/.env

    - name: Build Debug APK (Skip Tests)
      run: ./gradlew assembleDebug -x test -x lint --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: CinemaTV-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
