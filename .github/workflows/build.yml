name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download and Install Gradle 9.3.1 Manually
      run: |
        wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
        unzip -q gradle-9.3.1-bin.zip
        echo "${PWD}/gradle-9.3.1/bin" >> $GITHUB_PATH

    - name: Create Secrets File
      run: |
        echo "GEMINI_API_KEY=dummy_key" > .env
        mkdir -p app
        echo "GEMINI_API_KEY=dummy_key" > app/.env

    - name: Build Debug APK
      run: gradle assembleDebug -x test -x lint --no-daemon -Djava.awt.headless=true -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: CinemaTV-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
