name: Build & Release Asser TV APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and Install Gradle 9.3.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          echo "${PWD}/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Prepare Environment & Signing Keystore
        run: |
          echo "GEMINI_API_KEY=dummy_key" > .env
          mkdir -p app
          echo "GEMINI_API_KEY=dummy_key" > app/.env
          if [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
          fi
          cp debug.keystore app/debug.keystore

      - name: Build Signed APK
        run: gradle assembleDebug -x test -x lint -Dkotlin.daemon.jvm.options="-Xmx2g" -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Prepare Release APK Files
        run: |
          APK_SOURCE=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK_SOURCE" "app/build/outputs/apk/debug/AsserTV.apk"
          cp "$APK_SOURCE" "app/build/outputs/apk/debug/AsserTV-v1.0.${{ github.run_number }}.apk"

      - name: Publish APK to GitHub Releases (النسخ)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Asser TV v1.0.${{ github.run_number }}"
          body: |
            ## 🎬 Asser TV - إصدار جاهز للتثبيت (v1.0.${{ github.run_number }})
            - تم تجميع وتوقيع ملف الـ APK تلقائياً ونشره في قسم النسخ (**Releases**).
            - يدعم الهواتف الذكية وشاشات **Android TV**.
            - قم بتحميل ملف `AsserTV.apk` بالأسفل للتثبيت المباشر.
          files: |
            app/build/outputs/apk/debug/AsserTV.apk
            app/build/outputs/apk/debug/AsserTV-v1.0.${{ github.run_number }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
