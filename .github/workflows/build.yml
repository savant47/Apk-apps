name: Build SavantTV APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download and Install Gradle 9.3.1
      run: |
        wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
        unzip -q gradle-9.3.1-bin.zip
        echo "${PWD}/gradle-9.3.1/bin" >> $GITHUB_PATH

    - name: Create Secrets and Keystore
      run: |
        echo "GEMINI_API_KEY=dummy_key" > .env
        mkdir -p app
        echo "GEMINI_API_KEY=dummy_key" > app/.env
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
        cp debug.keystore app/debug.keystore

    - name: Build Debug APK
      run: gradle clean assembleDebug -x test -x lint -Dkotlin.daemon.jvm.options="-Xmx2g" -Dorg.gradle.jvmargs="-Xmx4g"

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/SavantTV-Debug.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: SavantTV-Debug-APK
        path: app/build/outputs/apk/debug/SavantTV-Debug.apk
